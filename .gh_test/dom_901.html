<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>body{margin:0;background:#eee;} 
  :root {
    --header-green: #16834c;
    --header-green-deep: #0f5132;
    --header-mint: #22c7a9;
    --header-yellow: #f7c948;
    --header-ink: #17251d;
    --header-muted: #69756f;
    --header-line: rgba(25, 135, 84, 0.16);
    --header-soft: #f5fbf7;
    --header-shadow: 0 18px 48px rgba(15, 81, 50, 0.16);
    --mega-bg: #ffffff;
    --mega-sidebar-bg: #f8faf9;
    --mega-hover: rgba(22, 131, 76, 0.08);
    --mega-active: rgba(22, 131, 76, 0.12);
    --mega-accent-gradient: linear-gradient(135deg, var(--header-green), var(--header-mint));
    --mega-card-gradient: linear-gradient(135deg, rgba(247, 252, 249, 0.6), rgba(255, 255, 255, 0.9));
    --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ============================
     SITE HEADER
     ============================ */

  .site-header {
    position: sticky;
    top: 12px;
    z-index: 1100;
    width: min(1200px, calc(100% - 32px));
    margin: 12px auto 0;
    color: var(--header-ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    animation: headerDropIn 0.55s ease both;
    transition: top 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }

  /* Animated aurora background glow */
  .site-header::before {
    content: "";
    position: absolute;
    inset: -40px;
    z-index: -1;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(22, 131, 76, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(34, 199, 169, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 0%, rgba(247, 201, 72, 0.04) 0%, transparent 40%);
    filter: blur(20px);
    animation: auroraShift 8s ease-in-out infinite alternate;
    pointer-events: none;
    border-radius: 24px;
  }

  @keyframes auroraShift {
    0% { opacity: 0.6; transform: scale(1) translateX(0); }
    50% { opacity: 1; transform: scale(1.05) translateX(5px); }
    100% { opacity: 0.7; transform: scale(1.02) translateX(-3px); }
  }

  .site-header.is-scrolled {
    top: 6px;
  }

  .header-shell {
    display: flex;
    align-items: center;
    gap: 20px;
    min-height: 78px;
    padding: 12px 16px;
    border: 1px solid var(--header-line);
    border-radius: 16px;
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.97), rgba(247, 252, 249, 0.95)),
      radial-gradient(circle at 5% 50%, rgba(247, 201, 72, 0.16), transparent 18rem);
    box-shadow: var(--header-shadow);
    backdrop-filter: blur(18px);
    overflow: visible;
    transition: min-height 0.25s ease, padding 0.25s ease, box-shadow 0.25s ease;
    position: relative;
  }

  /* Shimmer sweep effect across header */
  .header-shell::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
    animation: shimmerSweep 6s ease-in-out infinite;
    pointer-events: none;
    border-radius: 16px;
  }

  /* Floating decorative particles */
  .header-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: 16px;
    z-index: 0;
  }

  .header-particles span {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--header-green);
    opacity: 0.15;
    animation: floatParticle 8s ease-in-out infinite;
  }

  .header-particles span:nth-child(1) {
    top: 20%;
    left: 15%;
    animation-delay: 0s;
    animation-duration: 7s;
  }

  .header-particles span:nth-child(2) {
    top: 60%;
    left: 45%;
    animation-delay: 1.5s;
    animation-duration: 9s;
    width: 3px;
    height: 3px;
    background: var(--header-mint);
  }

  .header-particles span:nth-child(3) {
    top: 30%;
    left: 75%;
    animation-delay: 3s;
    animation-duration: 8s;
    width: 5px;
    height: 5px;
    background: var(--header-yellow);
  }

  .header-particles span:nth-child(4) {
    top: 70%;
    left: 85%;
    animation-delay: 2s;
    animation-duration: 10s;
    width: 3px;
    height: 3px;
  }

  .header-particles span:nth-child(5) {
    top: 45%;
    left: 30%;
    animation-delay: 4s;
    animation-duration: 8.5s;
    width: 4px;
    height: 4px;
    background: var(--header-mint);
  }

  @keyframes floatParticle {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.15; }
    25% { transform: translate(8px, -12px) scale(1.2); opacity: 0.25; }
    50% { transform: translate(-5px, -20px) scale(0.8); opacity: 0.1; }
    75% { transform: translate(12px, -8px) scale(1.1); opacity: 0.2; }
  }

  @keyframes shimmerSweep {
    0%, 20% { left: -50%; }
    80%, 100% { left: 150%; }
  }

  /* Decorative gradient separator at bottom */
  .header-shell::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--header-green), var(--header-mint), var(--header-yellow), transparent);
    opacity: 0.3;
    border-radius: 999px;
  }

  .site-header.is-scrolled .header-shell {
    min-height: 66px;
    padding-top: 8px;
    padding-bottom: 8px;
    box-shadow: 0 14px 36px rgba(15, 81, 50, 0.24);
  }

  /* Brand */
  .brand-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
    color: var(--header-ink);
    text-decoration: none;
    padding: 4px 6px 4px 0;
    border-radius: 8px;
  }

  .brand-icon {
    width: 50px;
    height: 50px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    color: #fff;
    background: linear-gradient(135deg, var(--header-green-deep), var(--header-green) 58%, var(--header-mint));
    box-shadow: 0 14px 28px rgba(22, 131, 76, 0.28);
    font-size: 1.55rem;
    transition: transform 0.24s ease, box-shadow 0.24s ease;
    position: relative;
  }

  /* Subtle pulsing glow behind brand icon */
  .brand-icon::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--header-green), var(--header-mint));
    opacity: 0;
    filter: blur(8px);
    z-index: -1;
    animation: iconPulseGlow 3s ease-in-out infinite;
  }

  @keyframes iconPulseGlow {
    0%, 100% { opacity: 0; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(1.08); }
  }

  .brand-link:hover .brand-icon {
    box-shadow: 0 18px 32px rgba(22, 131, 76, 0.34);
    transform: rotate(-5deg) scale(1.05);
  }

  .brand-text { display: grid; line-height: 1.05; }
  .brand-name {
    font-size: 1.5rem;
    font-weight: 950;
    letter-spacing: 0;
    background: linear-gradient(135deg, var(--header-green-deep), var(--header-green) 50%, var(--header-mint));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: transform 0.2s ease;
  }
  .brand-tagline {
    color: var(--header-muted);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(135deg, rgba(25, 135, 84, 0.08), rgba(34, 199, 169, 0.06));
    padding: 2px 8px;
    border-radius: 999px;
    display: inline-block;
    width: fit-content;
    border: 1px solid rgba(22, 131, 76, 0.1);
  }

  .brand-link:hover .brand-name { transform: translateX(2px); }
  .brand-name, .brand-tagline { transition: color 0.2s ease, transform 0.2s ease; }

  /* Nav wrap */
  .nav-wrap {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 18px;
    flex: 1 1 auto;
    min-width: 0;
  }

  /* Primary navigation links. These collapse (max-width ΓåÆ 0) as the search
     expands. We animate max-width (px) rather than width:auto so the browser
     can interpolate every intermediate frame ΓåÆ a truly smooth, continuous
     shrink that is synchronized with the search growth below. */
  .primary-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 0;
    padding: 0;
    list-style: none;
    flex: 0 0 auto;
    min-width: 0;
    max-width: none;
    overflow: hidden;
    white-space: nowrap;
    will-change: max-width, opacity, transform;
    /* opacity/transform fade quickly; max-width/margin match the search timing */
    transition:
      opacity 0.35s var(--transition-smooth),
      transform 0.35s var(--transition-smooth),
      max-width 0.5s var(--transition-smooth),
      margin 0.5s var(--transition-smooth),
      visibility 0.5s ease;
  }

  .nav-link-custom,
  .account-trigger {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 42px;
    padding: 8px 16px;
    border: 0;
    border-radius: 999px;
    color: #435047;
    background: transparent;
    font-weight: 750;
    font-size: 0.88rem;
    text-decoration: none;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  /* Ripple effect on click */
  .nav-link-custom .ripple,
  .account-trigger .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(22, 131, 76, 0.25);
    transform: scale(0);
    animation: rippleEffect 0.6s ease-out;
    pointer-events: none;
  }

  @keyframes rippleEffect {
    to {
      transform: scale(4);
      opacity: 0;
    }
  }

  /* Gradient sweep background on hover */
  .nav-link-custom::before,
  .account-trigger::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(22, 131, 76, 0.1), rgba(34, 199, 169, 0.08), rgba(247, 201, 72, 0.04));
    opacity: 0;
    transform: scaleX(0);
    transform-origin: left;
    transition: opacity 0.25s ease, transform 0.25s ease;
    border-radius: 999px;
  }

  .nav-link-custom:hover::before,
  .account-trigger:hover::before {
    opacity: 1;
    transform: scaleX(1);
  }

  .nav-link-custom::after,
  .account-trigger::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 6px;
    width: 20px;
    height: 3px;
    border-radius: 999px;
    margin-left: -10px;
    background: linear-gradient(90deg, var(--header-green), var(--header-mint));
    opacity: 0;
    transform: scaleX(0);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

.nav-link-custom:hover,
  .account-trigger:hover {
    color: var(--header-green-deep);
    background: rgba(25, 135, 84, 0.1);
    box-shadow: 0 6px 16px rgba(22, 131, 76, 0.1);
    transform: translateY(-1px);
  }

  .nav-link-custom:hover::after,
  .account-trigger:hover::after {
    opacity: 1;
    transform: scaleX(1);
  }

  .nav-link-custom i, .account-trigger i { color: var(--header-green); }

  /* Active state (for routes, if you add 'active' class later) */
  .nav-link-custom.active,
  .account-trigger.active {
    color: var(--header-green-deep);
    background: rgba(22, 131, 76, 0.12);
    box-shadow: 0 10px 22px rgba(22, 131, 76, 0.14);
  }

  .nav-link-custom.active::before,
  .account-trigger.active::before {
    opacity: 1;
    transform: scaleX(1);
  }

  .nav-link-custom.active::after,
  .account-trigger.active::after {
    opacity: 1;
    transform: scaleX(1);
  }

  /* Keyboard accessibility */
  .nav-link-custom:focus-visible,
  .account-trigger:focus-visible,
  .menu-toggle:focus-visible,
  .search-submit:focus-visible {
    outline: none;
    box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.22), 0 12px 30px rgba(15, 81, 50, 0.12);
    transform: translateY(-1px);
  }

  .cat-dropdown-menu a:focus-visible,
  .mega-sidebar-link:focus-visible,
  .mega-subsub-link:focus-visible,
  .shop-now-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.22);
  }

  /* Header actions (search, cart, account) */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
    min-width: 0;
    margin-left: auto;
  }

  /* ΓòÉΓòÉΓòÉ EXPANDABLE SEARCH ΓòÉΓòÉΓòÉ
     A single state class `.search-expanded` on .site-header toggles the
     center dynamic zone between the navigation menu and the full-width
     search field. The nav links fade/slide/collapse out (max-width ΓåÆ 0)
     while the search bar grows to all available width (set as a px by JS).
     Logo and the right-side controls (cart/notification/account) stay
     pinned because the nav's margin-right:auto was replaced by a fixed gap
     and .header-actions uses margin-left:auto. */
  .site-header.search-expanded .nav-wrap { gap: 0; }

  .site-header.search-expanded .primary-nav {
    opacity: 0;
    visibility: hidden;
    max-width: 0;
    margin-right: 18px;
    overflow: hidden;
    transform: translateX(-14px);
    pointer-events: none;
  }

  .site-header.search-expanded .header-search {
    flex: 0 1 auto;
    min-width: 0;
    margin-right: 18px;
  }

  .site-header.search-expanded .header-actions { flex: 0 0 auto; }

  /* Prominent active search field */
  .site-header.search-expanded .header-search input {
    border-color: rgba(25, 135, 84, 0.55);
    background: #fff;
    box-shadow:
      0 0 0 4px rgba(25, 135, 84, 0.1),
      0 6px 20px rgba(22, 131, 76, 0.12);
  }

  .header-search {
    position: relative;
    width: clamp(205px, 23vw, 310px);
    flex: 0 1 auto;
    min-width: 0;
    transition: width 0.5s var(--transition-smooth), margin-right 0.5s var(--transition-smooth), flex 0.5s var(--transition-smooth);
  }
  .header-search input {
    width: 100%;
    min-height: 44px;
    border: 1px solid var(--header-line);
    border-radius: 999px;
    padding: 10px 48px 10px 43px;
    color: var(--header-ink);
    background: rgba(248, 252, 250, 0.92);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    position: relative;
  }

  /* Animated placeholder */
  .header-search input::placeholder {
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .header-search input:focus::placeholder {
    opacity: 0.5;
    transform: translateX(4px);
  }

  .header-search input:focus {
    border-color: rgba(25, 135, 84, 0.5);
    background: #fff;
    box-shadow: 
      0 0 0 4px rgba(25, 135, 84, 0.1),
      0 4px 16px rgba(22, 131, 76, 0.08);
  }

  /* Gradient border glow on focus */
  .header-search:focus-within {
    position: relative;
  }

  .header-search:focus-within::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--header-green), var(--header-mint), var(--header-yellow));
    z-index: -1;
    opacity: 0.3;
    filter: blur(3px);
    animation: focusGlowPulse 2s ease-in-out infinite;
  }

  @keyframes focusGlowPulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.45; }
  }

  .search-icon { position: absolute; left: 16px; top: 50%; color: var(--header-muted); transform: translateY(-50%); transition: opacity 0.3s var(--transition-smooth), transform 0.3s var(--transition-smooth), color 0.3s ease; }
  .site-header.search-expanded .search-icon { opacity: 1; transform: translateY(-50%) scale(1); color: var(--header-green); }
  .search-submit {
    position: absolute;
    right: 5px;
    top: 50%;
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 50%;
    color: #fff;
    background: linear-gradient(135deg, var(--header-green), var(--header-mint));
    transform: translateY(-50%);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .search-submit:hover { box-shadow: 0 10px 20px rgba(22, 131, 76, 0.22); transform: translateY(-50%) scale(1.04); }

  .search-suggestions {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    z-index: 1400;
    display: none;
    overflow: hidden;
    border: 1px solid var(--header-line);
    border-radius: 12px;
    background: #fff;
    box-shadow: var(--header-shadow);
  }

  .search-suggestions.open {
    display: block;
  }

  .suggestion-link {
    display: grid;
    grid-template-columns: 42px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px;
    color: var(--header-ink);
    text-decoration: none;
  }

  .suggestion-link + .suggestion-link {
    border-top: 1px solid rgba(25, 135, 84, 0.08);
  }

  .suggestion-link:hover,
  .suggestion-link:focus-visible {
    color: var(--header-green-deep);
    background: rgba(25, 135, 84, 0.08);
    outline: none;
  }

  .suggestion-thumb {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 8px;
    color: var(--header-green);
    background: var(--header-soft);
  }

  .suggestion-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .suggestion-title {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.86rem;
    font-weight: 850;
  }

  .suggestion-meta {
    color: var(--header-muted);
    font-size: 0.74rem;
    font-weight: 750;
  }

  .suggestion-price {
    color: var(--header-green);
    font-size: 0.8rem;
    font-weight: 900;
    white-space: nowrap;
  }

  .cart-action {
    position: relative;
    width: 48px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    border-radius: 50%;
    color: var(--header-green-deep);
    background: linear-gradient(135deg, rgba(25, 135, 84, 0.1), rgba(32, 201, 151, 0.12));
    text-decoration: none;
    font-size: 1.25rem;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  /* Gradient ring on hover */
  .cart-action::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--header-green), var(--header-mint), var(--header-yellow), var(--header-green));
    opacity: 0;
    z-index: -1;
    transition: opacity 0.3s ease;
    animation: spin 3s linear infinite;
    filter: blur(2px);
  }

  .cart-action:hover::before {
    opacity: 0.7;
  }
  .cart-action:hover {
    color: var(--header-green-deep);
    background: rgba(25, 135, 84, 0.16);
    box-shadow: 0 12px 22px rgba(22, 131, 76, 0.14);
    transform: translateY(-2px);
  }
  .cart-action:hover i { animation: navIconPop 0.38s ease; }

  .cart-count {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    border: 2px solid #fff;
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(135deg, #dc3545, #f97316);
    font-size: 0.72rem;
    font-weight: 900;
    animation: countPulse 2s ease-in-out infinite;
  }

  @keyframes countPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* Account menu */
  .account-menu { position: relative; }
  .account-trigger { background: rgba(248, 252, 250, 0.92); border: 1px solid var(--header-line); }
  .account-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

  .account-dropdown {
    position: absolute;
    top: calc(100% + 12px);
    right: 0;
    min-width: 220px;
    margin: 0;
    padding: 10px;
    list-style: none;
    border: 1px solid var(--header-line);
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(247, 252, 249, 0.98)),
      radial-gradient(circle at top right, rgba(34, 199, 169, 0.12), transparent 12rem);
    box-shadow: var(--header-shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.96);
    transform-origin: top right;
    transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
  }
  .account-dropdown::before {
    content: "";
    position: absolute;
    top: -7px;
    right: 22px;
    width: 14px;
    height: 14px;
    border-left: 1px solid var(--header-line);
    border-top: 1px solid var(--header-line);
    background: rgba(255, 255, 255, 0.99);
    transform: rotate(45deg);
  }
  .account-menu.open .account-dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .dropdown-link-custom {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
    padding: 12px 12px;
    border-radius: 8px;
    color: #3f4d46;
    font-weight: 800;
    text-decoration: none;
    opacity: 0;
    transform: translateY(6px);
    transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
  }
  .account-menu.open .dropdown-link-custom { opacity: 1; transform: translateY(0); }
  .account-menu.open .account-dropdown li:nth-child(1) .dropdown-link-custom { transition-delay: 0.04s; }
  .account-menu.open .account-dropdown li:nth-child(2) .dropdown-link-custom { transition-delay: 0.08s; }
  .account-menu.open .account-dropdown li:nth-child(3) .dropdown-link-custom { transition-delay: 0.12s; }
  .account-menu.open .account-dropdown li:nth-child(4) .dropdown-link-custom { transition-delay: 0.16s; }

  .dropdown-link-custom i {

  /* Menu toggle & mobile cart */

  /* ============================
     MEGA DROPDOWN ΓÇö PREMIUM
     ============================ */

  .cat-dropdown { position: static; }

  .cat-dropdown-menu {
    position: absolute;
    top: calc(100% + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    width: 1100px;
    max-width: calc(100vw - 32px);
    padding: 0;
    border: 1px solid rgba(22, 131, 76, 0.12);
    border-radius: 18px;
    background: linear-gradient(180deg, 
      rgba(255, 255, 255, 0.99), 
      rgba(247, 252, 249, 0.97));
    backdrop-filter: blur(20px);
    box-shadow: 
      0 32px 80px rgba(15, 81, 50, 0.22),
      0 8px 24px rgba(0, 0, 0, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
    z-index: 1300;
    overflow: hidden;
  }

  /* Firefox ΓÇö no scrollbar on outer dropdown */
  .cat-dropdown-menu {
    scrollbar-width: none;
  }

  .cat-dropdown.menu-open .cat-dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
    animation: dropdownFadeIn 0.24s ease forwards;
  }

  .cat-dropdown.menu-open > .nav-link-custom {
    color: var(--header-green-deep);
    background: rgba(22, 131, 76, 0.12);
    box-shadow: 0 14px 30px rgba(22, 131, 76, 0.14);
  }

  @keyframes dropdownFadeIn {
    from {
      opacity: 0;
      transform: translateX(-50%) translateY(-12px);
    }
    to {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  }

  .cat-dropdown-menu::before {
    content: "";
    position: absolute;
    top: -8px;
    width: 16px;
    height: 16px;
    border-left: 1px solid rgba(22, 131, 76, 0.12);
    border-top: 1px solid rgba(22, 131, 76, 0.12);
    background: linear-gradient(135deg, 
      rgba(255, 255, 255, 0.99), 
      rgba(247, 252, 249, 0.97));
    left: var(--arrow-left, 50%);
    transform: translateX(-50%) rotate(45deg);
    z-index: 1;
  }

  /* Animated gradient border effect */
  .cat-dropdown-menu::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, 
      transparent 0%, 
      rgba(22, 131, 76, 0.3) 50%, 
      transparent 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .cat-dropdown.menu-open .cat-dropdown-menu::after {
    opacity: 1;
    animation: borderGlow 3s ease-in-out infinite;
  }

  @keyframes borderGlow {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
  }

  /* ---- Layout ---- */
  .mega-layout {
    display: flex;
    min-height: 540px;
    max-height: 560px;
  }

  /* ---- Sidebar ΓÇö Category List ΓÇö Premium ---- */
  .mega-sidebar {

  /* Animated left accent bar */

    align-items: center;
    justify-content: center;

  /* Gradient ring animation on hover */

    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 12px;
    background: conic-gradient(
      from 0deg,

      var(--header-yellow),

    transition: opacity 0.3s ease;

  .mega-sidebar-item.active .mega-sidebar-link .mega-icon-wrap::before {
