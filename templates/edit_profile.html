{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile - GroceryHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="glass-card p-5">
      <h2 class="text-center fw-bold text-success mb-5">
        <i class="bi bi-person-gear me-2"></i>Edit Profile
      </h2>
      
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-gradient btn-lg w-100 py-3 fs-5">
          <i class="bi bi-check-circle me-2"></i>Update Profile
        </button>
      </form>
      
      <div class="text-center mt-4">
        <a href="{% url 'store:profile' %}" class="text-muted">
          ← Back to Profile
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
</xai:function_call)

<xai:function_call name="create_file">
<parameter name="absolute_path">e:/grocery_store/templates/registration/password_change_form.html
