{% extends 'base.html' %}

{% block title %}Password Changed - GroceryHub{% endblock %}

{% block content %}
<div class="row justify-content-center min-vh-100 align-items-center">
  <div class="col-md-6">
    <div class="card shadow-lg border-0 rounded-4 p-5 text-center">
      <i class="bi bi-shield-check display-1 text-success mb-4"></i>
      <h2 class="fw-bold mb-3">Password Changed Successfully!</h2>
      <p class="lead text-muted">Your password has been updated. Check your notification bell for details.</p>
      <a href="{% url 'store:profile' %}" class="btn btn-success btn-lg px-5 mt-3">
        <i class="bi bi-person me-2"></i>Go to Profile
      </a>
    </div>
  </div>
</div>
{% endblock %}
