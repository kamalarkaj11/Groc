{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password - GroceryHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="glass-card p-5">
      <h2 class="text-center fw-bold text-success mb-4">
        <i class="bi bi-lock me-2"></i>Change Password
      </h2>
      
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-gradient btn-lg w-100 py-3">
          <i class="bi bi-arrow-clockwise me-2"></i>Change Password
        </button>
      </form>
      
      <div class="text-center mt-4">
        <a href="{% url 'store:profile' %}" class="text-muted">
          ← Back to Profile
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
</xai:function_call">

<xai:function_call name="create_file">
<parameter name="absolute_path">e:/grocery_store/templates/products/detail.html
